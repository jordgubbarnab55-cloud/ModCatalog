name: Seed legacy mods

# One-off: treats the packages in legacy-assets/ as uploads by the Discord
# account given in the inputs (that account becomes their owner and its
# username their author), which creates the `inbox` release convention, the
# three per-mod `mod-<slug>-<hash>` releases and the first site/catalog.json, then deploys
# Pages. Run it once by hand after the cutover; the legacy-assets/ directory
# is deleted in a follow-up commit (see SETUP.md). Shares the `catalog`
# concurrency group.

on:
  workflow_dispatch:
    inputs:
      uid:
        description: "Discord user id (digits) that owns the seeded mods"
        required: true
      username:
        description: "That account's Discord username (published as the author)"
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      AS_UID: ${{ inputs.uid }}
      AS_USERNAME: ${{ inputs.username }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Seed the example mods
        run: python build.py process --from-dir legacy-assets --as-uid "$AS_UID" --as-username "$AS_USERNAME"

      - name: Commit catalog + deploy Pages
        uses: ./.github/actions/commit-and-deploy
        with:
          commit_path: site/catalog.json
          commit_message: "Seed catalog from legacy assets"
