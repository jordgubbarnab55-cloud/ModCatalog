name: env probe (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GITHUB_OWNER: ${{ github.repository_owner }}
    steps:
      - run: |
          echo "=== with GH_REPO=jordgubbarnab55-cloud/ModCatalog ==="
          gh release list 2>&1; echo "rc=$?"
          echo "=== gh api repos/.../releases ==="
          gh api repos/jordgubbarnab55-cloud/ModCatalog/releases 2>&1 | head -c 200; echo; echo "rc=$?"
          echo "=== gh release create ==="
          gh release create probe-test-$$ --notes "probe" 2>&1; echo "rc=$?"
