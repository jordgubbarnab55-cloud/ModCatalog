name: Rebuild catalog

# Regenerates the WHOLE site/catalog.json from scratch from the mod-* release
# assets. The releases are the source of truth, so a lost or corrupt catalog
# is recoverable. Manual only (workflow_dispatch); shares the `catalog`
# concurrency group with the other catalog workflows so index merges never
# race. The Pages deploy happens in the same run (GITHUB_TOKEN pushes do not
# trigger other workflows). By default the run reads only the newest +
# oldest valid package per release (O(mods), not O(upload history));
# `full: true` selects the exhaustive audit of every package.

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Exhaustive audit: validate EVERY package of every release (slow; the default reads only the newest + oldest valid one per release)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild catalog from mod-* releases
        run: python build.py rebuild ${{ inputs.full == true && '--full' || '' }}

      - name: Commit catalog + deploy Pages
        uses: ./.github/actions/commit-and-deploy
        with:
          commit_path: site/catalog.json
          commit_message: "Rebuild catalog from releases"
