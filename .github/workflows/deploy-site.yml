name: Deploy site

# Deploys the site whenever site/** changes (a human editing index.html,
# upload.html or config.json). Pushes made by the bot with GITHUB_TOKEN do
# not trigger it, so there is no loop with the catalog workflows. Pages
# deploys via a custom Actions workflow are not subject to the 10-builds/hour
# legacy soft limit.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "mod-contract/tags.json"

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add the tag vocabulary to the site
        run: cp mod-contract/tags.json site/tags.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Regenerate the inline icon sprite from site/icons/*.svg (idempotent;
      # the deployed sprite is always fresh even if the committed one is stale).
      - name: Sync the icon sprite
        run: python scripts/sync-icons.py

      # The deployed catalog.json carries config.json's title/description at
      # once; the committed copy picks them up on the next catalog run.
      - name: Apply the catalog title from config.json
        run: python build.py retitle

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
