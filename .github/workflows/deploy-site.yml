name: Deploy site

# Deploys whenever site/** or the tag vocabulary changes on main. Pushes made
# by the bot with GITHUB_TOKEN do not trigger it, so there is no loop with
# the catalog workflows.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "mod-contract/tags.json"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/deploy-site
