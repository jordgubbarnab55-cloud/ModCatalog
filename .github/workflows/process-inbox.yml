name: Process inbox

# Wake-up only: the Cloudflare Worker queues uploads into the "inbox" release
# and dispatches this workflow. EACH RUN MUST DRAIN THE WHOLE INBOX — GitHub
# concurrency groups keep only one pending run (an older pending run is
# cancelled when a newer one queues), so a design that processes "the asset
# named in the dispatch payload" would silently strand uploads. The dispatch
# input carries no data on purpose.
#
# A commit pushed with GITHUB_TOKEN does not trigger other workflows, so the
# Pages deploy happens in this same run (see the commit-and-deploy action).

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    env:
      # `gh` CLI reads GH_TOKEN; the build never hand-rolls asset HTTP
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Drain the inbox: validate each package, re-home it to its mod's release,
      # merge into site/catalog.json. Invalid packages are rejected and
      # removed without blocking the rest of the run. The outcome events
      # (published/rejected, plus the stalled-upload sweeps) go to
      # inbox-results.json for the notify step below.
      - name: Drain the inbox release
        run: python build.py process --from-inbox --results-file inbox-results.json

      - name: Commit catalog + deploy Pages
        uses: ./.github/actions/commit-and-deploy
        with:
          commit_path: site/catalog.json
          commit_message: "Regenerate catalog from inbox"

      # After the Pages deploy (the site is live before the ping): POST the
      # run's outcome events to the Worker's /catalog/events. always() +
      # continue-on-error: the callback never fails the run; a missing results
      # file or missing secrets is a no-op (exit 0).
      - name: Notify the catalog event endpoint
        if: always()
        continue-on-error: true
        env:
          CATALOG_CALLBACK_URL: ${{ secrets.CATALOG_CALLBACK_URL }}
          CATALOG_CALLBACK_SECRET: ${{ secrets.CATALOG_CALLBACK_SECRET }}
        run: python build.py notify --results inbox-results.json
