name: Commit catalog and deploy Pages

# Shared tail for the catalog workflows: commit the generated catalog (scoped
# to one path, so __pycache__/ or anything else Python leaves behind can
# never be committed) and deploy the site in the SAME run, because a commit
# pushed with GITHUB_TOKEN does not trigger other workflows.
#
# The checkout may predate a commit a concurrent run just pushed, so a
# no-change run deploys site/ from the latest origin/main instead.

inputs:
  commit_path:
    description: The generated path to commit (and the only path checked)
    required: true
  commit_message:
    description: Commit message for the generated change
    required: true

runs:
  using: composite
  steps:
    - name: Commit generated changes
      shell: bash
      run: |
        if [ -n "$(git status --porcelain "${{ inputs.commit_path }}")" ]; then
          git config user.name "ModCatalog Bot"
          git config user.email "modcatalog-bot@users.noreply.github.com"
          git add "${{ inputs.commit_path }}"
          git commit -m "${{ inputs.commit_message }}"
          git push
        else
          git fetch origin main
          git checkout origin/main -- site
        fi

    - uses: ./.github/actions/deploy-site
