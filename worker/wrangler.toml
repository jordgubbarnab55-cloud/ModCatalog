# ModCatalog Worker (Cloudflare, free plan)
#
# Deployed by the project owner (npx wrangler login / kv:namespace / secret /
# deploy). NOTHING in this repo requires installing wrangler; the tests run
# with bare `node --test` (Node 20+).

name = "modcatalog"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
GITHUB_OWNER = "jordgubbarnab55-cloud"
GITHUB_REPO = "ModCatalog"
# Origin allowed for CORS on /upload (the Pages site). The native app sends
# no Origin header and is unaffected.
ALLOWED_ORIGIN = "https://jordgubbarnab55-cloud.github.io"
# Optional: upload bytes per Discord user per UTC day (default 2 GiB)
UPLOAD_DAILY_BYTES = "2147483648"
# The Pages site (ends with /); the #mods button's "Open the uploader"
# link is SITE_URL + "#login=<code>" (URL fragment, never a query string)
SITE_URL = "https://jordgubbarnab55-cloud.github.io/ModCatalog/"

# Forum ingestion configuration (the poller no-ops while these are blank):
#   FORUM_GUILD_ID / FORUM_CHANNEL_ID  the dedicated forum channel (type 15)
#   FORUM_TAG_MAP    a JSON object mapping the forum's applied-tag names to the
#                   catalog tag vocabulary ({} = no tags are ever published)
#   FORUM_CUTOFF_THREAD_ID  only threads with a snowflake NEWER than this are
#                          ever considered (set it right before the first live
#                          deploy so existing posts are not prompted)
#   CATALOG_URL      the public catalog.json (used to reconcile published rows)
FORUM_GUILD_ID = "1565286417968398356"
FORUM_CHANNEL_ID = "1570021563602829374"
FORUM_TAG_MAP = "{}"
FORUM_CUTOFF_THREAD_ID = "1570099638336356443"
CATALOG_URL = "https://jordgubbarnab55-cloud.github.io/ModCatalog/catalog.json"

# Secrets -- set with `npx wrangler secret put NAME`, never committed:
#   DISCORD_PUBLIC_KEY  base64 public key from the Discord application
#   GITHUB_TOKEN        fine-grained token: this repo only,
#                       Contents: Read and write + Actions: Read and write
#   DISCORD_BOT_TOKEN   the bot token (forum ingestion; MESSAGE_CONTENT intent
#                       enabled on the app, the bot has View Channel / Read
#                       Message History / Send Messages in Threads in the forum)
#   FORUM_CALLBACK_SECRET  shared HMAC secret the ingest workflow signs
#                       /forum/status with (also a GitHub Actions secret)

# The forum ingestion poller: one tick every 5 minutes (free-plan scheduled
# trigger; the tick makes at most ~12 subrequests, well inside the budget).
[triggers]
crons = [ "* * * * *" ]   # testing cadence; back to "*/5 * * * *" after

# Upload quotas (`quota:<id>`) and the inbox release-id cache only;
# tokens and login codes live in D1 (binding `DB`, below).
[[kv_namespaces]]
binding = "TOKENS"
id = "a0739f0e764f41d69db0345c8c3d7a6f"

# D1 (binding `DB`, renamed from `FORUM` by migration 0002): forum
# ingestion state (0001) + tokens / login codes (0002). Create it first:
#   npx wrangler d1 create modcatalog-forum      (copy the database_id below)
# then apply the migrations:
#   npx wrangler d1 migrations apply modcatalog-forum --remote
[[d1_databases]]
binding = "DB"
database_name = "modcatalog-forum"
database_id = "780fb9ed-e5ca-4f8b-a528-9494c701f249"

# Secrets for the forum flow (above) are set with `npx wrangler secret put`.
